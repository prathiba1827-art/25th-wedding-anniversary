<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Silver Jubilee | GA Arokiaraj Ravi &amp; A Mary Francina</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --cream: #fffaf6;
  --blush: #f7eee9;
  --rose: #a76c70;
  --pink: #b77d7d;
  --dark: #503f43;
  --sage: #526052;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  color: var(--dark);
  font-family: "Cormorant Garamond", serif;
  overflow-x: hidden;
}

button, a { font-family: inherit; }
img { display: block; max-width: 100%; }

/* PETALS ONLY */

.petal {
  position: fixed;
  top: -35px;
  z-index: 9999;
  pointer-events: none;
  width: var(--size);
  height: calc(var(--size) * 1.4);
  background: linear-gradient(145deg, #fff0f3, var(--petal-color));
  border-radius: var(--shape);
  box-shadow: 0 1px 3px rgba(130,65,80,.08);
  animation: falling var(--duration) linear forwards;
}

.petal::after {
  content: "";
  position: absolute;
  left: 22%;
  top: 12%;
  width: 24%;
  height: 54%;
  border-radius: 50%;
  background: rgba(255,255,255,.3);
  transform: rotate(22deg);
}

@keyframes falling {
  0% {
    transform: translate3d(0,-30px,0) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: .8; }
  50% {
    transform: translate3d(var(--drift-mid),50vh,0) rotate(240deg);
  }
  100% {
    transform: translate3d(var(--drift),110vh,0) rotate(600deg);
    opacity: .2;
  }
}

.burst-petal {
  position: fixed;
  left: 50%;
  top: 50%;
  z-index: 10001;
  pointer-events: none;
  width: var(--size);
  height: calc(var(--size) * 1.4);
  background: linear-gradient(145deg,#fff0f3,var(--petal-color));
  border-radius: var(--shape);
  animation: burst var(--duration) ease-out forwards;
}

@keyframes burst {
  0% {
    transform: translate(-50%,-50%) scale(.2) rotate(0);
    opacity: 0;
  }
  10% { opacity: .95; }
  100% {
    transform: translate(var(--x),var(--y)) scale(.75) rotate(var(--rotation));
    opacity: 0;
  }
}

/* OPENING */

#opening {
  position: fixed;
  inset: 0;
  z-index: 5000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: radial-gradient(circle at top,#fffdf9,#fff8f1 48%,#f7e9e2);
  transition: opacity 1s ease, visibility 1s ease;
}

#opening.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.opening-content {
  width: min(92%,760px);
  padding: 24px 15px;
  text-align: center;
}

.wedding-verse {
  max-width: 620px;
  margin: 0 auto 18px;
  color: #513f43;
  font-size: clamp(21px,4vw,28px);
  font-weight: 700;
  line-height: 1.4;
}

.wedding-verse-reference {
  margin-top: 10px;
  color: var(--rose);
  font: 700 12px "Montserrat",sans-serif;
  letter-spacing: 3px;
}

.opening-divider, .divider {
  width: 90px;
  height: 1px;
  margin: 22px auto 28px;
  background: #d99c91;
}

.envelope-wrapper {
  position: relative;
  width: 390px;
  max-width: 90vw;
  margin: auto;
}

.envelope {
  position: relative;
  width: 100%;
  height: 245px;
  perspective: 1000px;
  cursor: pointer;
  filter: drop-shadow(0 18px 22px rgba(120,70,65,.13));
}

.envelope-back {
  position: absolute;
  inset: 0;
  background: #fff8f1;
  border: 1px solid #e4c5bf;
}

.inner-card {
  position: absolute;
  left: 8%;
  right: 8%;
  bottom: 13%;
  height: 75%;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fffdf9;
  border: 1px solid #e8d3cb;
}

.inner-small {
  color: #9b706d;
  font: 600 10px "Montserrat",sans-serif;
  letter-spacing: 3px;
}

.inner-25 {
  margin: 5px 0;
  color: var(--pink);
  font-size: 70px;
  font-weight: 700;
  line-height: .9;
}

.inner-text { color: #74575b; font-size: 17px; }

.envelope-left, .envelope-right, .envelope-bottom {
  position: absolute;
  z-index: 4;
}

.envelope-left {
  left: 0;
  bottom: 0;
  width: 50%;
  height: 100%;
  background: #f3ded7;
  clip-path: polygon(0 0,100% 50%,0 100%);
}

.envelope-right {
  right: 0;
  bottom: 0;
  width: 50%;
  height: 100%;
  background: #f0d9d3;
  clip-path: polygon(100% 0,0 50%,100% 100%);
}

.envelope-bottom {
  left: 0;
  bottom: 0;
  width: 100%;
  height: 65%;
  background: #efd7d1;
  clip-path: polygon(0 100%,50% 0,100% 100%);
}

.envelope-top {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 60%;
  z-index: 6;
  background: #dbaea9;
  clip-path: polygon(0 0,50% 100%,100% 0);
  transform-origin: top;
  transition: transform 1s cubic-bezier(.2,.8,.2,1);
}

.envelope.open .envelope-top {
  transform: rotateX(180deg);
  z-index: 1;
}

.envelope-border {
  position: absolute;
  inset: 7px;
  z-index: 7;
  border: 1px solid rgba(160,110,105,.25);
  pointer-events: none;
}

.seal {
  position: absolute;
  z-index: 10;
  top: 50%;
  left: 50%;
  width: 78px;
  height: 78px;
  transform: translate(-50%,-50%);
  overflow: hidden;
  border: 4px solid var(--cream);
  border-radius: 50%;
  background: var(--cream);
  box-shadow: 0 5px 16px rgba(80,50,50,.2),0 0 0 2px #d59b91;
}

.seal img { width: 100%; height: 100%; object-fit: cover; }

/* SMALL CSS PETALS AROUND ENVELOPE */

.corner-petal {
  position: absolute;
  width: 12px;
  height: 21px;
  border-radius: 75% 25% 65% 35% / 60% 40% 60% 40%;
  background: linear-gradient(145deg,#f8dbe2,#d98799);
  opacity: .8;
}

.corner-one { top: -15px; left: -10px; transform: rotate(-35deg); }
.corner-two { top: -8px; right: -10px; transform: rotate(55deg); }
.corner-three { bottom: 40px; left: -16px; transform: rotate(40deg); }
.corner-four { bottom: 35px; right: -16px; transform: rotate(-50deg); }

.tap-text {
  margin-top: 22px;
  color: #8e6261;
  font: 700 12px "Montserrat",sans-serif;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.tap-subtext { margin-top: 7px; color: #9b7774; font-size: 15px; }

/* MAIN CONTENT */

#main {
  opacity: 0;
  visibility: hidden;
  transition: opacity 1s ease;
}

#main.show { opacity: 1; visibility: visible; }

.section-inner { width: min(900px,92%); margin: auto; }

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  text-align: center;
  background:
    radial-gradient(circle at 20% 20%,rgba(244,211,205,.35),transparent 28%),
    radial-gradient(circle at 80% 80%,rgba(223,233,216,.35),transparent 30%),
    var(--cream);
}

.eyebrow, .section-label {
  color: #9a706d;
  font: 700 12px "Montserrat",sans-serif;
  letter-spacing: 4px;
  text-transform: uppercase;
}

.hero h1 {
  margin-top: 25px;
  color: var(--rose);
  font-size: clamp(130px,25vw,230px);
  font-weight: 500;
  line-height: .8;
}

.hero-script, .invitation-title, .with-love {
  color: var(--pink);
  font-family: "Great Vibes",cursive;
}

.hero-script {
  margin-top: 5px;
  font-size: clamp(48px,8vw,85px);
}

.names {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  color: var(--dark);
  font-size: clamp(25px,4vw,42px);
  font-weight: 700;
}

.names span:nth-child(2) {
  color: var(--pink);
  font: 400 40px "Great Vibes",cursive;
}

.hero-date {
  margin-top: 22px;
  color: #79595d;
  font: 700 13px "Montserrat",sans-serif;
  letter-spacing: 2px;
}

/* DATE */

.save-date {
  padding: 110px 20px;
  text-align: center;
  background: var(--cream);
}

.save-date h2 {
  margin-top: 18px;
  color: #59464a;
  font-size: clamp(40px,6vw,62px);
  font-weight: 700;
}

.big-date {
  margin-top: 35px;
  color: #9b6267;
  font-size: clamp(42px,7vw,80px);
  font-weight: 700;
}

.weekday {
  margin-top: 18px;
  color: #a16f6c;
  font: 700 12px "Montserrat",sans-serif;
  letter-spacing: 4px;
}

  margin-top: 12px;
  color: #604c50;
  font: 700
